def getVersionNameTimestamp() {
    return new Date().format('dd.MM.yy')
}

def getCurrentFlavor() {
    Gradle gradle = getGradle()
    String  tskReqStr = gradle.getStartParameter().getTaskRequests().toString()

    Pattern pattern

    if( tskReqStr.contains( "assemble" ) )
        pattern = Pattern.compile("assemble(\\w+)(Release|Debug)")
    else
        pattern = Pattern.compile("generate(\\w+)(Release|Debug)")

    Matcher matcher = pattern.matcher( tskReqStr )

    if( matcher.find() )
        return matcher.group(1).toLowerCase()
    else
    {
        println "NO MATCH FOUND"
        return ""
    }
}

task copyLibFlin (type: Copy) {
    outputs.upToDateWhen { false }
    from "$projectDir\\..\\..\\libs\\obj\\local\\armeabi-v7a\\"
    into "$projectDir\\src\\flin\\libs\\armeabi-v7a"
    include "*.so"
}


    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "${variant.name}-${variant.versionName}.apk"
        }
        variant.assembleProvider.configure { assemble ->
            assemble.doLast {
                delete "$projectDir\\..\\..\\result\\flin\\"

                copy {
                    from variant.outputs*.outputFile
                    into "$projectDir\\..\\..\\result\\flin\\"
                }

                copy {
                    from "$projectDir\\..\\..\\libs\\obj\\local\\armeabi-v7a\\"
                    into "$projectDir\\..\\..\\result\\flin\\"
                    include "*.so"
                }
            }
        }
    }
